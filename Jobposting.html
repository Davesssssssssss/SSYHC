<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Job Post</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fbf1e2;
      margin: 0;
      padding: 30px;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      color: #000;
      margin-bottom: 25px;
    }

    label {
      font-size: 12px;
      font-weight: bold;
      color: #000;
      margin-bottom: 5px;
    }

    input, select, textarea {
      border: 1px solid #f5b96d !important;
      border-radius: 6px !important;
      padding: 10px 12px !important;
      font-size: 14px;
      background-color: #fff;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #f29b3e !important;
      box-shadow: none !important;
    }

    select {
      background-image: url("data:image/svg+xml;utf8,<svg fill='%23f29b3e' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      appearance: none;
    }

    textarea {
      resize: none;
      height: 150px;
    }

    .btn-verify {
      background-color: #f29b3e;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-verify:hover {
      background-color: #e38b1e;
    }

    .btn-submit {
      background-color: #f5b96d;
      color: black;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn-submit:hover {
      background-color: #eaa24e;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CREATE JOB POST</h1>

    <form>
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label>JOB DESIGNATION</label>
          <select class="form-select" id="jobDesignation">
            <option value="">Select Job Designation</option>
            <option value="Senior Care">Senior Care</option>
            <option value="Child Care">Child Care</option>
            <option value="Pet Care">Pet Care</option>
            <option value="Tutoring">Tutoring</option>
            <option value="HouseKeeping">HouseKeeping</option>
          </select>
        </div>

        <div class="col-md-2">
          <label>ZIPCODE</label>
          <input type="text" class="form-control" placeholder="Zipcode" id="JOBzipcode">
        </div>

        <div class="col-md-4">
          <label>ADDRESS</label>
          <input type="text" class="form-control" placeholder="Address" id="JOBaddress">
        </div>

        <div class="col-md-2 d-grid">
          <button type="button" class="btn btn-verify" onclick="verifyZicode()">VERIFY</button>
        </div>
      </div>

      <div class="row g-3 mt-2">
        <div class="col-md-4">
          <label>WORK EXPERIENCE</label>
          <input type="text" class="form-control" placeholder="Work Experience" id="workexp">
        </div>

        <div class="col-md-4">
          <label>JOB TYPE</label>
          <select class="form-select" id="jobtype">
            <option value="">Select Job Type</option>
            <option value="Full-Time">Full-Time</option>
            <option value="Part-Time">Part-Time</option>
          </select>
        </div>

        <div class="col-md-4">
          <label>SALARY RATE</label>
          <input type="text" class="form-control" placeholder="Salary Rate" id="rate">
        </div>
      </div>

      <div class="row mt-3">
        <div class="col-12">
          <label>JOB DESCRIPTION</label>
          <textarea class="form-control" placeholder="Enter job description..." id="jobDesc"></textarea>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-auto">
          <button type="button" class="btn btn-submit" onclick="doCreateJobs(event)">SUBMIT</button>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>

let usaZip = document.getElementById("JOBzipcode").value
         const zips = document.getElementById("JOBzipcode").value.trim();

           if (!/^\d{5}$/.test(zips)) {
       
        alert("Please enter a valid 5-digit US ZIP code.")
     
      }

      fetch(`https://api.zippopotam.us/us/${zips}`)
        .then(response => {

            throw new Error('ZIP code not found');
          }
          return response.json();
        })
        .then(data => {
          const place = data.places[0];

          // window.parent.postMessage({ action: "SearchZipcode", data: {usZipcode} }, "*");
        })
        .catch(error => {
         
          console.log(error.message);
          
        });
    }

  </script>
</body>
</html>

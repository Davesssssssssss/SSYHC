<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Applicants UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Your styles (same as before) */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #fff8ee;
      display: flex;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
    }

    h1 {
      color: #333;
      font-size: 2.5em;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .applicant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .applicant-card {
      background-color: #fff;
      border: 2px solid #ffcc80;
      border-radius: 10px;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .avatar {
      width: 50px;
      height: 50px;
      background-color: #ffead0;
      border-radius: 50%;
      margin-right: 15px;
      border: 1px solid #ffbb77;
    }

    .info {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .info .name {
      font-weight: bold;
      color: #333;
      font-size: 1.1em;
    }

    .info .role {
      color: #666;
      font-size: 0.9em;
    }

    .view-btn {
      background-color: #ffcc80;
      color: #333;
      border: none;
      border-radius: 5px;
      padding: 8px 15px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .view-btn:hover {
      background-color: #ffb84d;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .pagination button {
      background-color: #ffead0;
      border: 1px solid #ffcc80;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.1em;
      cursor: pointer;
      color: #666;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .pagination button:hover {
      background-color: #ffcc80;
      color: #333;
    }

    .pagination button.active {
      background-color: #ffcc80;
      color: #333;
      font-weight: bold;
      border-color: #ffcc80;
    }

    .nav-arrow {
      background-color: #ffead0 !important;
      border: 1px solid #ffcc80 !important;
      color: #666 !important;
    }

    .nav-arrow:hover {
      background-color: #ffcc80 !important;
      color: #333 !important;
    }

    @media (max-width: 768px) {
      .applicant-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 2em;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>APPLICANTS</h1>
    <div class="applicant-grid" id="applicantGrid">
      <!-- Applicants will load here -->
    </div>
    <div class="pagination">
      <button class="nav-arrow">&lt;</button>
      <button class="page-num active">1</button>
      <button class="page-num">2</button>
      <button class="page-num">3</button>
      <button class="nav-arrow">&gt;</button>
    </div>
  </div>

<script>
  // Handle postMessage from Wix
  window.onmessage = function(event) {
    const { action, applicants } = event.data;

    if (action === "loadApplicants") {
      console.log("Received applicants:", applicants);
      renderApplicants(applicants);
    }
  };

  function renderApplicants(applicants) {
    const grid = document.getElementById('applicantGrid');
    grid.innerHTML = '';  // Clear the grid

    applicants.forEach(app => {
      const name = app.firstname || "No Name";
      const lname = app.lastname || "No Last Name";  // Fix the incorrect 'firstname' reference
      const role = app.job_role || "Unknown Role";
      const image = app.formalid || "default-image-url.jpg"; // Use a default image URL if missing
  const userid = app.userid || "No Last Name"; // Use a default image URL if missing

      const card = document.createElement("div");
      card.className = "applicant-card";
      card.innerHTML = `
        <div class="avatar">
          <img src="${image}" alt="${name}'s Avatar" style="width: 50px; height: 50px; border-radius: 50%;  margin-right: 15px; "/>
        </div>
        <div class="info">
          <span class="name">${name.toUpperCase()}</span>
          <span class="role">${role.toUpperCase()}</span>
        </div>
        <button class="view-btn" onclick="dosendUserid(${userid})">VIEW</button>
      `;

      // card.querySelector('.view-btn').addEventListener('click', () => {
      //   alert(`Viewing details for ${name}`);
      // });

      grid.appendChild(card);
    });
  }
  function dosendUserid(userid){
     window.parent.postMessage({ action: "getuserid", data: {userid} }, "*");
  }
</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --bg-color: #FFF7ED;
            --form-bg-color: #FFFFFF;
            --border-color: #FDBA74;
            --accent-color: #FB923C;
            --text-color: #4B5563;
            --placeholder-color: #9CA3AF;
            --button-bg-color: #FDBA74;
            --button-text-color: #4A2C0D;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .form-container {
            background-color: var(--form-bg-color);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 2px solid var(--border-color);
            width: 100%;
            max-width: 28rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group:last-of-type {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            color: var(--text-color);
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--form-bg-color);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-family: inherit;
            color: var(--text-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder {
            color: var(--placeholder-color);
            text-transform: uppercase;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(251, 146, 60, 0.5);
        }
        
        .button-container {
            display: flex;
            justify-content: flex-end;
        }

        .submit-btn {
            background-color: var(--button-bg-color);
            color: var(--button-text-color);
            font-weight: 700;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .submit-btn:hover {
            background-color: var(--accent-color);
            transform: scale(1.05);
        }

        .submit-btn:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="fullName">Fullname</label>
                <input
                    type="text"
                    id="fullName"
                    class="form-input"
                    placeholder="FULLNAME"
                    required
                    aria-label="Full Name"
                />
            </div>
            <div class="form-group">
                <label for="zipcode">Zipcode</label>
                <input
                    type="text"
                    id="zipcode"
                    class="form-input"
                    placeholder="ZIPCODE"
                    required
                    aria-label="Zip Code"
                />
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input
                    type="text"
                    id="address"
                    class="form-input"
                    required
                    aria-label="Address"
                />
            </div>
               <div class="form-group">
                <label for="phone">Phone</label>
                <input
                    type="text"
                    id="phone"
                    class="form-input"
                    required
                    aria-label="Address"
                />
            </div>
            <div class="button-container">
                <button type="submit" class="submit-btn">
                    Apply Now
                </button>
            </div>
        </form>
    </div>
 <script>
  window.onmessage = function(event) {
    const { action, applicants } = event.data;

    if (action === "load") {
      console.log("Received applicants:", applicants);
      renderApplicants(applicants);
    }
  };

  function renderApplicants(applicants) {
    document.getElementById("fullName").value = applicants.fullName || "";
    document.getElementById("zipcode").value = applicants.zipcode || "";
    document.getElementById("address").value = applicants.address || "";
    document.getElementById("phone").value = applicants.phone || "";
  }

  function handleSubmit(event) {
    event.preventDefault();

    const data = {
      fullName: document.getElementById("fullName").value,
      zipcode: document.getElementById("zipcode").value,
      address: document.getElementById("address").value,
      phone: document.getElementById("phone").value,
    };

    // Send back to Wix
    window.parent.postMessage({ action: "submitForm", data }, "*");
    alert("Form submitted!");
  }
</script>

</body>
</html>
